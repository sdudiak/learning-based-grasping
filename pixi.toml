[workspace]
name = "isaac-manipulation"
version = "0.1.0"
description = "TODO"
channels = ["conda-forge"]
platforms = [{ platform = "linux-64", glibc = "2.35" }]

[dependencies]
python = "3.11.*"

[activation]
scripts = ["scripts/activate_ros.sh"]

[activation.env]
ROS_DISTRO = "jazzy"
RMW_IMPLEMENTATION = "rmw_fastrtps_cpp"

[pypi-options]
extra-index-urls = ["https://pypi.nvidia.com"]

[pypi-dependencies]
torch = { version = "==2.7.0+cu128", index = "https://download.pytorch.org/whl/cu128" }
isaacsim = { version = "==5.1.0", extras = ["all", "extscache"] }

[tasks]
save-masked-images = "python isaac_ws/dataset_generation/segmentation/save_masked_images.py"
generate-dataset = "env -u PYTHONPATH -u OLD_PYTHONPATH python -u isaac_ws/dataset_generation/segmentation/generate_dataset.py"
download-gso-objects = "python scripts/download_gso_objects.py"
convert-gso-objects = "env -u PYTHONPATH -u OLD_PYTHONPATH python scripts/convert_assets.py"
isaacsim = { cmd = "bash scripts/run_isaac.sh isaacsim --ext-folder isaac_ws/extensions" }
isaacsim-default-scene = { cmd = "bash scripts/run_isaac.sh isaacsim --ext-folder isaac_ws/extensions --enable isaac_manipulation.scene_loader --/exts/isaac_manipulation.scene_loader/scene=isaac_ws/assets/scenes/default_secene.usda" }
isaacsim-random-objects-scene = { cmd = "bash scripts/run_isaac.sh isaacsim --ext-folder isaac_ws/extensions --enable isaac_manipulation.scene_loader --/exts/isaac_manipulation.scene_loader/scene=isaac_ws/assets/scenes/default_scene_empty_table.usda --enable isaac_manipulation.object_spawner --/exts/isaac_manipulation.object_spawner/auto_spawn=true --/exts/isaac_manipulation.object_spawner/show_ui=false" }

[tasks.ros-build]
cwd = "ros_ws"
cmd = """
env -u PYTHONPATH -u OLD_PYTHONPATH -u AMENT_PREFIX_PATH -u CMAKE_PREFIX_PATH -u COLCON_PREFIX_PATH -u LD_LIBRARY_PATH PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin bash --noprofile --norc -ec 'source /opt/ros/jazzy/setup.bash; exec colcon build --symlink-install --packages-up-to isaac_manipulation_bringup isaac_manipulation_pointcloud --cmake-args -DBUILD_TESTING=OFF -DPython3_EXECUTABLE=/usr/bin/python3'
"""

[tasks.ros-moveit]
depends-on = ["ros-build"]
cwd = "ros_ws"
cmd = """
env -u PYTHONPATH -u OLD_PYTHONPATH -u AMENT_PREFIX_PATH -u CMAKE_PREFIX_PATH -u COLCON_PREFIX_PATH -u LD_LIBRARY_PATH PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin bash --noprofile --norc -ec 'source /opt/ros/jazzy/setup.bash; source install/setup.bash; exec ros2 launch isaac_manipulation_bringup moveit.launch.py "$@"' --
"""

[tasks.rviz]
depends-on = ["ros-build"]
cwd = "ros_ws"
cmd = """
env -u PYTHONPATH -u OLD_PYTHONPATH -u AMENT_PREFIX_PATH -u CMAKE_PREFIX_PATH -u COLCON_PREFIX_PATH -u LD_LIBRARY_PATH PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin bash --noprofile --norc -ec 'source /opt/ros/jazzy/setup.bash; source install/setup.bash; exec ros2 launch isaac_manipulation_bringup rviz.launch.py "$@"' --
"""

[tasks.ros-pointcloud]
depends-on = ["ros-build"]
cwd = "ros_ws"
cmd = """
env -u PYTHONPATH -u OLD_PYTHONPATH -u AMENT_PREFIX_PATH -u CMAKE_PREFIX_PATH -u COLCON_PREFIX_PATH -u LD_LIBRARY_PATH PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin bash --noprofile --norc -ec 'source /opt/ros/jazzy/setup.bash; source install/setup.bash; exec ros2 launch isaac_manipulation_pointcloud pointcloud.launch.py "$@"' --
"""

[environments]
ml = { features = ["ml"], no-default-feature = true }
segmentation = { features = ["segmentation"], no-default-feature = true }

[feature.ml.dependencies]
python = "3.11.*"

[feature.ml.pypi-dependencies]
torch = { version = "==2.7.0+cu128", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "==0.22.0+cu128", index = "https://download.pytorch.org/whl/cu128" }
numpy = "==1.26.4"
opencv-python = "==4.11.0.86"
pillow = "==11.3.0"
tensorboard = ">=2.18, <3"

[feature.ml.activation.env]
PYTHONPATH = ""

[feature.ml.tasks]
prepare-segmentation-dataset = "python -u -m ml_ws.segmentation.scripts.prepare_dataset"
tensorboard = "tensorboard --logdir ml_ws/outputs/segmentation --host 127.0.0.1 --port 6006"
prepare-segmentation-splits = "python -m ml_ws.segmentation.scripts.prepare_splits"
train-segmentation = "python -u -m ml_ws.segmentation.scripts.train"
segment-dataset = "python -u -m ml_ws.segmentation.scripts.predict"
evaluate-segmentation = "python -m ml_ws.scripts.evaluation.evaluate_segmentation"
compare-segmentation = "python -m ml_ws.scripts.evaluation.compare_segmentation"

[feature.segmentation.dependencies]
python = "3.12.*"

[feature.segmentation.pypi-dependencies]
grasping-segmentation = { path = "ml_ws", editable = true }
torch = { version = "==2.7.0+cu128", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "==0.22.0+cu128", index = "https://download.pytorch.org/whl/cu128" }
numpy = "==1.26.4"
opencv-python-headless = "==4.11.0.86"
pyyaml = ">=6, <7"
lark = ">=1, <2"
argcomplete = ">=3, <4"
psutil = ">=5, <8"
packaging = ">=24"
setuptools = ">=68, <81"
catkin-pkg = ">=1, <2"
empy = "==3.3.4"
importlib-metadata = ">=7"
importlib-resources = ">=6"

[feature.segmentation.tasks.ros-segmentation]
cmd = "python scripts/ros_segmentation.py"

[feature.segmentation.tasks.ros-perception]
cmd = "python scripts/ros_perception.py"
