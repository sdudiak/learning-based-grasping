[model]
pretrained = true
min_size = 480
max_size = 800
score_threshold = 0.01
max_detections = 100

[training]
epochs = 20
batch_size = 2
workers = 0
learning_rate = 0.0025
momentum = 0.9
weight_decay = 0.0005
lr_step_epochs = 8
lr_gamma = 0.1
amp = true
seed = 42

[augmentation]
enabled = true
horizontal_flip = 0.5
vertical_flip = 0.5
brightness = 0.15
contrast = 0.15
saturation = 0.1
hue = 0.02
blur_probability = 0.1
