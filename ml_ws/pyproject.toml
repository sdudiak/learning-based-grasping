[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grasping-segmentation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.7,<2.8", "torchvision>=0.22,<0.23", "numpy>=1.26,<2", "pillow>=10"]

[project.optional-dependencies]
training = ["tensorboard>=2.18,<3"]
evaluation = ["opencv-python-headless>=4.11,<5"]

[tool.setuptools]
packages = ["ml_ws", "ml_ws.segmentation", "ml_ws.segmentation.scripts", "ml_ws.scripts", "ml_ws.scripts.evaluation"]
package-dir = {"ml_ws" = "."}

[tool.setuptools.package-data]
"ml_ws.segmentation" = ["configs/*.toml"]
