pointcloud:
  ros__parameters:
    use_sim_time: true
    input_cloud_topic: ''
    depth_topic: /isaac/cameara/wrist/aligned_depth_to_color/image_raw
    camera_info_topic: /isaac/cameara/wrist/color/camera_info
    mask_topic: /segmentation/instance_mask
    target_topic: /pointcloud/target
    environment_topic: /pointcloud/environment
    centroid_topic: /pointcloud/target_centroid
    bounding_box_topic: /pointcloud/target_bbox
    output_frame: panda_link0
    selection_distance: 0.10
    association_distance: 0.08
    ambiguity_margin: 0.02
    minimum_points: 20
    synchronization_tolerance: 0.0
    maximum_observation_age: 3.0
    cache_capacity: 90
    minimum_depth: 0.01
    maximum_depth: 10.0
    voxel_resolution: 0.0
    debug: false
    visualization: true
